<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>Hand Cycling - אופניים ידניים</title>
  <!-- Wheels -->
  <circle cx="12" cy="44" r="10" stroke="currentColor" stroke-width="2"/>
  <circle cx="52" cy="44" r="10" stroke="currentColor" stroke-width="2"/>
  <!-- Frame -->
  <path d="M12 44l18-16h10l12 16" stroke="currentColor" stroke-width="2.5"/>
  <path d="M30 28l12 0" stroke="currentColor" stroke-width="2.5"/>
  <!-- Handlebars with hand cranks -->
  <circle cx="40" cy="24" r="6" stroke="currentColor" stroke-width="2"/>
  <line x1="40" y1="18" x2="40" y2="30" stroke="currentColor" stroke-width="2"/>
  <line x1="34" y1="24" x2="46" y2="24" stroke="currentColor" stroke-width="2"/>
  <!-- Rider upper body -->
  <circle cx="26" cy="20" r="5" fill="currentColor"/>
  <path d="M26 25l4 3" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
</svg>
